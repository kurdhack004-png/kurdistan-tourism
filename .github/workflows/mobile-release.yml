name: Mobile Release

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  release:
    name: Flutter Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Check localization keys
        run: dart run tool/check_localization.dart

      - name: Analyze
        run: flutter analyze

      - name: Force Gradle to use Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          cd android
          ./gradlew -version

      - name: Build APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          API_URL="${API_BASE_URL:-https://soliloquy-insistent-bird.abasthan.app/api}"
          echo "Building with production API: $API_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"

      - name: Create tag
        id: tag
        run: |
          TAG="android-v${{ github.run_number }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Kurdistan Tourism Android v${{ github.run_number }}
          generate_release_notes: true
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
