plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.kurdistan.tourism'
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId 'com.kurdistan.tourism'
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Required because compileOptions.coreLibraryDesugaringEnabled is true
    // above (geolocator_android needs this on minSdk < 26).
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

tasks.named("assembleRelease") {
    doLast {
        def apk = file("$buildDir/outputs/apk/release/app-release.apk")
        def flutterOutput = file("${rootProject.projectDir}/../build/app/outputs/flutter-apk")

        if (apk.exists()) {
            flutterOutput.mkdirs()
            copy {
                from apk
                into flutterOutput
                rename { "app-release.apk" }
            }
            println("APK copied to Flutter output: ${flutterOutput}/app-release.apk")
        } else {
            throw new GradleException("Release APK not found: ${apk}")
        }
    }
}
