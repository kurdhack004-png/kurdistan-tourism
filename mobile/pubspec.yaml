name: kurdistan_tourism
description: Kurdistan Tourism — offline-first travel companion app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  maplibre_gl: ^0.27.1
  geolocator: ^12.0.0
  easy_localization: ^3.0.8
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  uuid: ^4.4.0
  crypto: ^3.0.7
  file_picker: ^8.1.7
  supabase_flutter: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
