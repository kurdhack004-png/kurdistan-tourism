<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kurdistan Tourism Admin</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#182230;--muted:#66788a;--line:#e1e8f0;--brand:#102a43;--accent:#1677ff;--danger:#d83a3a;--ok:#1a9d5c;--warn:#d98a00}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Noto Naskh Arabic","Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
/* login */
.login{max-width:420px;margin:70px auto;padding:0 16px}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 5px 20px #102a4314}
.login h2{margin-top:0}
/* layout */
.shell{display:flex;min-height:100vh}
.side{width:230px;background:var(--brand);color:#fff;padding:16px 10px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.side .brand{font-weight:800;padding:8px 12px 14px;font-size:16px}
.side button.nav{background:none;border:0;color:#cfe0f3;text-align:start;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:15px}
.side button.nav:hover{background:#ffffff14}
.side button.nav.on{background:#ffffff26;color:#fff;font-weight:700}
.side .sp{flex:1}
main{flex:1;padding:22px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h1{margin:0;font-size:22px}
.hint{margin:0 0 14px;color:var(--muted);font-size:13px}
/* controls */
.btn{padding:9px 14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:#e8eef6;color:var(--ink)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.6;cursor:wait}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid #ccd6e0;border-radius:10px;background:#fff}
textarea.input{min-height:84px;resize:vertical}
label.f{display:block;margin-bottom:12px;font-weight:600;font-size:13px}
label.f>.input,label.f>div{margin-top:5px;font-weight:400}
label.chk{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:600;font-size:13px}
/* stats */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.num{font-size:26px;font-weight:800;margin-top:4px}
/* table */
.tw{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:0 5px 20px #102a4314}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:#fafcfe;white-space:nowrap}
tr:last-child td{border-bottom:0}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:48px;height:36px;object-fit:cover;border-radius:6px;background:#e8eef6;display:block}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#e8eef6}
.pill.ok{background:#dff5ea;color:var(--ok)}.pill.no{background:#fde8e8;color:var(--danger)}
.cell-text{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* modal */
.ov{position:fixed;inset:0;background:#0a1a2c99;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;padding:20px}
.modal h3{margin-top:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row-end{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.imgs .im{position:relative}
.imgs .im img{width:84px;height:62px;object-fit:cover;border-radius:8px;display:block;background:#e8eef6}
.imgs .im button{position:absolute;top:-6px;inset-inline-end:-6px;border:0;background:var(--danger);color:#fff;width:20px;height:20px;border-radius:50%;cursor:pointer;line-height:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#102a43;color:#fff;padding:10px 18px;border-radius:10px;z-index:40;font-weight:600}
.toast.err{background:var(--danger)}
@media(max-width:820px){
 .shell{flex-direction:column}
 .side{width:auto;flex-direction:row;overflow-x:auto;padding:8px}
 .side .brand,.side .sp{display:none}
 .side button.nav{white-space:nowrap}
 main{padding:14px}.two{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="card">
    <h2 id="l-title"></h2>
    <label class="f"><span data-t="api_url"></span><input id="api" class="input" dir="ltr"></label>
    <label class="f"><span data-t="email"></span><input id="email" class="input" dir="ltr" autocomplete="username"></label>
    <label class="f"><span data-t="password"></span><input id="pass" class="input" type="password" dir="ltr" autocomplete="current-password"></label>
    <button id="loginBtn" class="btn" data-t="login"></button>
    <button id="langL" class="btn ghost" style="margin-inline-start:8px"></button>
    <p id="msg" class="muted"></p>
  </div>
</div>

<div id="app" class="shell hidden">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>

/* ============================== helpers ============================== */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v===false||v==null)continue;if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='value')e.value=v;else e.setAttribute(k,v===true?'':v)}
  for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}
const safeUrl=u=>/^(https?:\/\/[^\s]+|\/uploads\/[\w.\-]+)$/.test(u||'')?u:'';
const fmtNum=n=>new Intl.NumberFormat('en-US').format(Math.round(Number(n)||0));
const fmtDate=s=>s?new Date(s).toLocaleString():'';
const toLocalInput=s=>{if(!s)return'';const d=new Date(s),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
let toastT;function toast(msg,err){document.querySelector('.toast')?.remove();const e=h('div',{class:'toast'+(err?' err':'')},msg);document.body.append(e);clearTimeout(toastT);toastT=setTimeout(()=>e.remove(),3200)}

let API=localStorage.getItem('kt_api')||(location.protocol.startsWith('http')&&location.pathname.startsWith('/admin')?location.origin+'/api':'http://localhost:8000/api');
let TOKEN=localStorage.getItem('kt_token')||'';
let CURRENCY='IQD';

async function api(path,{method='GET',body}={}){
  const r=await fetch(API+path,{method,headers:{'content-type':'application/json',Authorization:'Bearer '+TOKEN},body:body?JSON.stringify(body):undefined});
  let j;try{j=await r.json()}catch{j={success:false,message:'Bad response ('+r.status+')'}}
  if(r.status===401){logout(true);throw new Error(j.message||'Unauthorized')}
  if(!j.success)throw new Error(j.message||'Error');return j.data}
const run=async(fn)=>{try{return await fn()}catch(e){toast(e.message||String(e),true)}};

async function uploadFile(file){
  if(file.size>6*1024*1024)throw new Error(t('too_big'));
  const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Could not read file'));r.readAsDataURL(file)});
  return (await api('/admin/upload',{method:'POST',body:{filename:file.name,data}})).url}

/* ============================== table + form ============================== */
function cell(col,row){
  const[k,type]=col,v=row[k];
  if(type==='img'){const u=safeUrl(v);return u?h('img',{class:'thumb',src:u,alt:'',loading:'lazy'}):h('div',{class:'thumb'})}
  if(type==='bool')return h('span',{class:'pill '+(v?'ok':'no')},v?'✔':'✕');
  if(type==='enum')return t('o_'+v);
  if(type==='date')return fmtDate(v);
  if(type==='money')return fmtNum(v);
  if(type==='text')return h('div',{class:'cell-text',title:v||''},v||'');
  return v==null?'':String(v)}

function table(cols,rows,actionsFn,labelFn){
  if(!rows.length)return h('div',{class:'card muted'},t('no_data'));
  return h('div',{class:'tw'},h('table',null,
    h('thead',null,h('tr',null,cols.map(c=>h('th',null,labelFn?labelFn(c):t('f_'+c[0]))),actionsFn&&h('th',null,t('actions')))),
    h('tbody',null,rows.map(r=>h('tr',null,cols.map(c=>h('td',null,c.render?c.render(r):cell(c,r))),actionsFn&&h('td',null,h('div',{class:'acts'},actionsFn(r))))))))}

function imageField(f,val){
  const state={v:val||''};const prev=h('div',{class:'imgs'});const inp=h('input',{class:'input',dir:'ltr',placeholder:'https://…',value:state.v});
  const file=h('input',{type:'file',accept:'image/jpeg,image/png,image/webp,image/gif',class:'hidden'});
  const draw=()=>{prev.replaceChildren();const u=safeUrl(state.v);if(u)prev.append(h('div',{class:'im'},h('img',{src:u,alt:''})))};
  inp.addEventListener('input',()=>{state.v=inp.value.trim();draw()});
  file.addEventListener('change',()=>run(async()=>{if(!file.files[0])return;const u=await uploadFile(file.files[0]);state.v=u;inp.value=u;draw()}));
  draw();
  const el=h('div',null,prev,inp,h('div',{style:'margin-top:6px'},h('button',{type:'button',class:'btn sm ghost',onclick:()=>file.click()},t('upload')),file));
  el.get=()=>state.v;return el}

function imagesField(f,val){
  const list=Array.isArray(val)?[...val]:[];const prev=h('div',{class:'imgs'});const inp=h('input',{class:'input',dir:'ltr',placeholder:'https://…'});
  const file=h('input',{type:'file',accept:'image/jpeg,image/png,image/webp,image/gif',multiple:true,class:'hidden'});
  const draw=()=>{prev.replaceChildren(...list.map((u,i)=>h('div',{class:'im'},h('img',{src:safeUrl(u),alt:''}),h('button',{type:'button',title:t('remove'),onclick:()=>{list.splice(i,1);draw()}},'×'))))};
  file.addEventListener('change',()=>run(async()=>{for(const fl of file.files){list.push(await uploadFile(fl));draw()}file.value=''}));
  draw();
  const el=h('div',null,prev,h('div',{style:'display:flex;gap:6px'},inp,h('button',{type:'button',class:'btn sm ghost',onclick:()=>{const u=inp.value.trim();if(safeUrl(u)){list.push(u);inp.value='';draw()}}},t('add_url'))),
    h('div',{style:'margin-top:6px'},h('button',{type:'button',class:'btn sm ghost',onclick:()=>file.click()},t('upload')),file));
  el.get=()=>list;return el}

function openForm({title,fields,values={},onSave}){
  const ctl={};const body=h('div',{class:'two'});
  for(const f of fields){
    const v=values[f.k]??(f.def!==undefined?f.def:'');let input;
    if(f.t==='bool'){input=h('input',{type:'checkbox'});input.checked=!!v;input.get=()=>input.checked;body.append(h('label',{class:'chk'},input,t('f_'+f.k)));ctl[f.k]=input;continue}
    if(f.t==='select'){input=h('select',{class:'input'},f.opts.map(o=>h('option',{value:o},t('o_'+o))));input.value=v||f.opts[0];input.get=()=>input.value}
    else if(f.t==='area'){input=h('textarea',{class:'input'});input.value=v;input.get=()=>input.value}
    else if(f.t==='image'){input=imageField(f,v)}
    else if(f.t==='images'){input=imagesField(f,v)}
    else if(f.t==='datetime'){input=h('input',{class:'input',type:'datetime-local',dir:'ltr'});input.value=toLocalInput(v);input.get=()=>input.value?new Date(input.value).toISOString():''}
    else if(f.t==='password'){input=h('input',{class:'input',type:'password',dir:'ltr',autocomplete:'new-password'});input.value=v;input.get=()=>input.value}
    else if(f.t==='num'){input=h('input',{class:'input',type:'number',step:f.step||'any',dir:'ltr'});input.value=v;input.get=()=>input.value}
    else{input=h('input',{class:'input',dir:f.t==='url'?'ltr':null,type:'text'});input.value=v;input.get=()=>input.value}
    ctl[f.k]=input;
    const lab=h('label',{class:'f',style:f.full||['area','image','images'].includes(f.t)?'grid-column:1/-1':null},t('f_'+f.k)+(f.req?' *':''),input);
    body.append(lab)}
  const save=h('button',{class:'btn'},t('save'));
  const close=()=>ov.remove();
  const ov=h('div',{class:'ov',onmousedown:e=>{if(e.target===ov)close()}},h('div',{class:'modal'},h('h3',null,title),body,h('div',{class:'row-end'},h('button',{class:'btn ghost',onclick:close},t('cancel')),save)));
  save.addEventListener('click',()=>run(async()=>{save.disabled=true;try{const out={};for(const f of fields)out[f.k]=ctl[f.k].get();await onSave(out);close()}finally{save.disabled=false}}));
  document.body.append(ov)}

async function resourceView(name){
  const cfg=RES[name],main=$('#main');

    const rows=await api(cfg.ep);

      ...(cfg.extra?cfg.extra(r,load):[]),
      h('button',{class:'btn sm danger',onclick:()=>{if(confirm(t('confirm_delete')))run(async()=>{await api(`${cfg.ep}/${r.id}`,{method:'DELETE'});toast(t('deleted'));load()})}},t('delete'))].filter(Boolean);
    main.replaceChildren(head(t('nav_'+name),h('button',{class:'btn',onclick:()=>openForm({title:t('add'),fields:cfg.fields,onSave:async v=>{await api(cfg.ep,{method:'POST',body:v});toast(t('saved'));load()}})},'+ '+t('add'))),

/* ============================== auth ============================== */
function logout(silent){TOKEN='';localStorage.removeItem('kt_token');$('#app').classList.add('hidden');$('#login').classList.remove('hidden');if(silent)$('#msg').textContent=''}
async function enter(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');applyLang();nav();try{const s=await api('/admin/stats');CURRENCY=s.currency||'IQD'}catch{return}show()}
$('#loginBtn').addEventListener('click',async()=>{
  const msg=$('#msg');msg.textContent='';API=($('#api').value||API).trim().replace(/\/$/,'');
  try{
    const r=await fetch(API+'/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#email').value.trim(),password:$('#pass').value})});
    const j=await r.json();
    if(!j.success){msg.textContent=j.message||t('login_failed');return}
    if(j.data.user.role!=='admin'){msg.textContent=t('admin_only');return}
    TOKEN=j.data.token;localStorage.setItem('kt_token',TOKEN);localStorage.setItem('kt_api',API);$('#pass').value='';enter()
  }catch(e){msg.textContent=t('login_failed')+' ('+e.message+')'}});
$('#pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});
$('#langL').addEventListener('click',()=>{lang=lang==='ku'?'en':'ku';localStorage.setItem('kt_lang',lang);applyLang()});
$('#api').value=API;applyLang();
if(TOKEN)enter();
