<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kurdistan Tourism Admin</title><style>body{margin:0;font-family:Inter,Arial;background:#f4f7fb;color:#182230}.top{background:#102a43;color:#fff;padding:18px 24px;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 20px #102a4314}.num{font-size:30px;font-weight:800}.login{max-width:420px;margin:80px auto}.input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ccd6e0;border-radius:10px}.btn{padding:12px 16px;border:0;border-radius:10px;background:#1677ff;color:#fff;font-weight:700;cursor:pointer}.danger{background:#d83a3a}.muted{color:#66788a}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="top"><b>🏔️ Kurdistan Tourism Admin</b><button class="btn" onclick="logout()">Logout</button></div><div id="login" class="login card"><h2>Admin Login</h2><input id="api" class="input" placeholder="API URL" value="http://localhost:8000/api"><input id="email" class="input" placeholder="Admin email"><input id="pass" class="input" type="password" placeholder="Admin password"><button class="btn" onclick="login()">Login</button><p id="msg" class="muted"></p></div><main id="app" class="wrap hidden"><div class="grid"><div class="card"><div class="muted">Users</div><div id="users" class="num">-</div></div><div class="card"><div class="muted">Locations</div><div id="locations" class="num">-</div></div><div class="card"><div class="muted">Bookings</div><div id="bookings" class="num">-</div></div><div class="card"><div class="muted">Revenue</div><div id="revenue" class="num">-</div></div></div><div class="card" style="margin-top:20px"><div class="row"><h2>API Status</h2><span id="status">Checking...</span></div><p class="muted">Use the backend API for locations, bookings, reviews, favorites and AI. This dashboard is intentionally dependency-free.</p></div></main><script>let API=localStorage.getItem('kt_api')||'http://localhost:8000/api';async function login(){API=(document.getElementById('api').value||'http://localhost:8000/api').replace(/\/$/,'');localStorage.kt_api=API;const r=await fetch(API+'/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:email.value,password:pass.value})});const j=await r.json();if(j.success&&j.data.user.role==='admin'){localStorage.token=j.data.token;show()}else msg.textContent=j.message||'Admin login failed'}async function show(){loginEl=document.getElementById('login');loginEl.classList.add('hidden');document.getElementById('app').classList.remove('hidden');const r=await fetch(API+'/admin/stats',{headers:{Authorization:'Bearer '+localStorage.token}});const j=await r.json();if(j.success){users.textContent=j.data.users;locations.textContent=j.data.locations;bookings.textContent=j.data.bookings;revenue.textContent='$'+j.data.revenue;status.textContent='ONLINE'}else status.textContent='API ERROR'}function logout(){localStorage.removeItem('token');location.reload()}if(localStorage.token)show()</script></body></html>
