services:
  - type: web
    name: kurdistan-tourism-api
    runtime: node
    rootDir: backend-node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "require"
      - key: ADMIN_EMAIL
        value: admin@kurdistantourism.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
